<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><title>Testy pravidel</title>
<style>body{font-family:monospace;background:#111;color:#ddd;padding:16px}.ok{color:#7c7}.bad{color:#f66}</style></head>
<body><h1>Testy pravidel – Schizma</h1><pre id="out"></pre>
<script type="module">
const E = await import('./js/engine.js?nc=' + Date.now());
const out = document.getElementById('out');
let pass = 0, fail = 0;
function t(name, fn) {
  try { fn(); pass++; out.innerHTML += `<span class="ok">✔ ${name}</span>\n`; }
  catch (e) { fail++; out.innerHTML += `<span class="bad">✘ ${name}: ${e.message}</span>\n`; }
}
const eq = (a, b, m = '') => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${m} očekáváno ${JSON.stringify(b)}, je ${JSON.stringify(a)}`); };
const ok = (v, m) => { if (!v) throw new Error(m || 'nesplněno'); };

// Pozice ze zápisu: {'e1':'wK', 'd4':'bP*'} (* = pokání), tah barvy turn
function pos(map, turn = 'w', extra = {}) {
  const s = E.initialState();
  s.board = Array(64).fill(null);
  let id = 100;
  for (const [sq, code] of Object.entries(map)) {
    s.board[E.sqIndex(sq)] = { id: ++id, c: code[0], t: code[1], pen: code.includes('*') };
  }
  s.turn = turn;
  Object.assign(s, extra);
  return s;
}
const acts = (s) => E.legalActions(s);
const has = (s, a) => acts(s).includes(a);
const apply = (s, a) => E.applyAction(s, a);
const P = (s, sq) => s.board[E.sqIndex(sq)];
const kindOf = (s, a) => E.legalMoves(s).find((m) => E.moveToString(m) === a)?.kind;
// Hranice daleko v rohu, aby nic neupalovaly
const FAR = { a1: 'wR', h1: 'wR', a8: 'bR', h8: 'bR' };

t('Výchozí pozice: Hříšníci 16 tahů + Misionáři 4 + Hranice 0', () => eq(acts(E.initialState()).length, 20));

t('Výchozí jezdci jsou Misionáři, střelci Kardinálové', () => {
  const s = E.initialState();
  eq(P(s, 'b1').t, 'N'); eq(E.NAMES.N, 'Misionář'); eq(E.NAMES.B, 'Kardinál');
});

// ---------- Pokání ----------
t('Hříšník bere a propadá pokání', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wP', e5: 'bN' });
  const r = apply(s, 'd4e5');
  ok(P(r.state, 'e5').pen);
  ok(r.events.some((e) => e.type === 'penance'));
});

t('Kající se figurka nesmí brát vůbec (ani upálením)', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wQ*', d7: 'bN', b2: 'bP' });
  ok(!has(s, 'd4d7'));
  ok(!has(s, 'd4b2'), 'b2 je v dosahu Hranice a1, ale kající nesmí');
  ok(has(s, 'd4d6'));
});

t('Misionář bere s pokáním', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', c1: 'wB', d4: 'wN', e6: 'bQ', c8: 'bB' });
  eq(kindOf(s, 'd4e6'), 'penance');
});

// ---------- Hranice ----------
t('Hranice skáče na volné pole v poloměru 1 (Žár 1)', () => {
  const s = pos({ e1: 'wK', e8: 'bK', d4: 'wR', d5: 'bP', c3: 'wP', a8: 'bR', h8: 'bR', h1: 'wR' });
  const rook = E.legalMoves(s).filter((m) => m.from === E.sqIndex('d4')).map(E.moveToString).sort();
  eq(rook, ['d4c4', 'd4c5', 'd4d3', 'd4e3', 'd4e4', 'd4e5']);
});

t('Hranice nebere a nelze ji odstranit', () => {
  const s = pos({ e1: 'wK', e8: 'bK', d4: 'wQ', d6: 'bR', a1: 'wR', h1: 'wR', h8: 'bR' });
  ok(!has(s, 'd4d6'), 'Inkvizitor nesmí brát Hranici');
  ok(!has(s, 'd4d7'), 'Hranice blokuje cestu');
  const s2 = pos({ e1: 'wK', e8: 'bK', d4: 'wR', d5: 'bQ', a1: 'wR', a8: 'bR', h8: 'bR' });
  ok(!has(s2, 'd4d5'));
});

t('Hranice se Žárem 3 skáče až o 3 pole přes figurky', () => {
  const s = pos({ e1: 'wK', e8: 'bK', d4: 'wR', d5: 'wP', d6: 'bP', a1: 'wR', a8: 'bR', h8: 'bR', h1: 'wQ' }, 'w', { inq: { w: 3, b: 0 } });
  ok(has(s, 'd4d7'));
  ok(has(s, 'd4g1'));
  ok(!has(s, 'd4d8'));
});

// ---------- Upálení ----------
t('Upálení: figurka v dosahu Hranice padne bez pokání', () => {
  const s = pos({ e1: 'wK', e8: 'bK', d1: 'wR', h1: 'wR', a8: 'bR', h8: 'bR', a4: 'wB', c2: 'bN' });
  // c2 je v dosahu Hranice d1 (poloměr 1)
  eq(kindOf(s, 'a4c2'), 'burn');
  const r = apply(s, 'a4c2');
  ok(!P(r.state, 'c2').pen);
  ok(r.events.find((e) => e.type === 'capture').rooks.includes(E.sqIndex('d1')));
});

t('Hříšník neupaluje – v dosahu Hranice bere s pokáním', () => {
  const s2 = pos({ e1: 'wK', e8: 'bK', d4: 'wR', h1: 'wR', a8: 'bR', h8: 'bR', d2: 'wP', e3: 'bN' });
  eq(kindOf(s2, 'd2e3'), 'penance');
});

t('Žár neblokují překážky', () => {
  const s = pos({ e1: 'wK', e8: 'bK', d4: 'wR', a1: 'wR', a8: 'bR', h8: 'bR', h5: 'wQ', e5: 'bN', d5: 'wP' }, 'w', { inq: { w: 1, b: 0 } });
  // e5 je v poloměru 1 od d4, Inkvizitor h5 bere e5 upálením
  eq(kindOf(s, 'h5e5'), 'burn');
});

// ---------- Žár ----------
t('Inkvizice zvyšují Žár (1 → úroveň 2, 3 → úroveň 3)', () => {
  let s = pos({ ...FAR, e1: 'wK', e8: 'bK', d1: 'wQ', d5: 'bP', c8: 'bB' });
  eq(E.heatOf(s, 'w'), 1);
  const r = apply(s, 'd1d5');
  eq(r.state.inq.w, 1); eq(E.heatOf(r.state, 'w'), 2);
  ok(r.events.some((e) => e.type === 'heat' && e.level === 2));
  s = pos({ ...FAR, e1: 'wK', e8: 'bK', d1: 'wQ', d5: 'bP', c8: 'bB' }, 'w', { inq: { w: 2, b: 0 } });
  eq(E.heatOf(apply(s, 'd1d5').state, 'w'), 3);
});

t('Ztráta posledního Inkvizitora vynuluje Žár', () => {
  const s2 = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wQ', e5: 'bB', c8: 'bB' }, 'b', { inq: { w: 3, b: 0 } });
  const r2 = apply(s2, 'e5d4');
  eq(r2.state.inq.w, 0);
  ok(r2.events.some((e) => e.type === 'heatLost' && e.color === 'w'));
});

t('S dvěma Inkvizitory Žár trvá, dokud žije aspoň jeden', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wQ', g2: 'wQ', e5: 'bB', c8: 'bB' }, 'b', { inq: { w: 2, b: 0 } });
  eq(apply(s, 'e5d4').state.inq.w, 2);
});

// ---------- Papež ----------
t('Papež bere jen upálením (cíl v dosahu jeho Hranice)', () => {
  const s = pos({ e1: 'wK', e8: 'bK', f1: 'wR', a1: 'wR', a8: 'bR', h8: 'bR', e2: 'bN', d2: 'bN' });
  // e2 v dosahu f1, d2 ne
  eq(kindOf(s, 'e1e2'), 'execute');
  ok(!has(s, 'e1d2'));
});

t('Papeže lze odstranit jen upálením a nikdy Hříšníkem', () => {
  const s = pos({ a1: 'wR', h1: 'wR', d5: 'bR', h8: 'bR', e4: 'bK', d3: 'wP', c3: 'wN', a6: 'wK', c8: 'bB' });
  // e4 je v dosahu černé d5, ne bílé → bílí ho nemohou odstranit
  ok(!has(s, 'd3e4'));
  ok(!has(s, 'c3e4'));
  const s2 = pos({ a1: 'wR', h1: 'wR', e3: 'wR', h8: 'bR', a8: 'bR', e4: 'bK', d3: 'wP', c5: 'wN', a6: 'wK', c8: 'bB' });
  ok(!has(s2, 'd3e4'), 'Hříšník Papeže nikdy');
  eq(kindOf(s2, 'c5e4'), 'burn');
});

t('Křižák Papeže jen v dosahu Hranice, jinak bere s odpustkem', () => {
  const s = pos({ ...FAR, e1: 'wK', e5: 'bK', d3: 'wC', b4: 'bQ', c8: 'bB' });
  ok(!has(s, 'd3e5'));
  eq(kindOf(s, 'd3b4'), 'crusade');
});

t('Žádná rošáda', () => {
  const s = pos({ e1: 'wK', h1: 'wR', a1: 'wR', e8: 'bK', a8: 'bR', h8: 'bR' });
  ok(!has(s, 'e1g1')); ok(!has(s, 'e1c1'));
});

t('Monitum: soupeřův Papež se ocitne v dosahu Hranice', () => {
  const s = pos({ a1: 'wR', f4: 'wR', a8: 'bR', h8: 'bR', e1: 'wK', e6: 'bK', c8: 'bB' });
  const r = apply(s, 'f4f5');
  ok(r.events.some((e) => e.type === 'monitum' && e.color === 'b'));
});

// ---------- Zpověď ----------
t('Kardinál zpovídá jen vodorovně/svisle', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wB', c3: 'wP*', f5: 'wN' });
  const r = apply(s, 'f5d6');
  ok(P(r.state, 'c3').pen, 'diagonálně ne');
  const s2 = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wB', c5: 'wN*' });
  const r2 = apply(s2, 'c5d3');
  ok(r2.state.board[E.sqIndex('d3')].pen === false, 'd3 je svisle pod d4');
});

t('Papež zpovídá i diagonálně, Kardinál se zpovídá jen u Papeže', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', c3: 'wB*' });
  const r = apply(s, 'c3d2');
  ok(!P(r.state, 'd2').pen, 'd2 diagonálně u Papeže e1');
  const s2 = pos({ ...FAR, e1: 'wK', e8: 'bK', c4: 'wB*', b2: 'wB' });
  const r2 = apply(s2, 'c4b3');
  ok(r2.state.board[E.sqIndex('b3')].pen, 'Kardinál se u Kardinála nezpovídá');
});

t('Inkvizitor se zpovídá u Kardinála', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', c1: 'wB', f2: 'wQ*' });
  ok(!P(apply(s, 'f2c2').state, 'c2').pen);
});

// ---------- Křížová výprava ----------
t('Ztráta posledního Kardinála: Misionáři → Křižáci, natrvalo', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', c1: 'wB', b1: 'wN*', g1: 'wN', d2: 'bQ' }, 'b');
  const r = apply(s, 'd2c1');
  eq(P(r.state, 'b1').t, 'C'); ok(!P(r.state, 'b1').pen);
  eq(P(r.state, 'g1').t, 'C');
  ok(r.state.crusade.w);
  ok(r.events.some((e) => e.type === 'crusade'));
});

t('Po vyhlášení dává proměna v jezdce Křižáka i s novým Kardinálem', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', c3: 'wB', b7: 'wP', c8: 'bB' }, 'w', { crusade: { w: true, b: false } });
  eq(P(apply(s, 'b7b8n').state, 'b8').t, 'C');
  const s2 = pos({ ...FAR, e1: 'wK', e8: 'bK', c3: 'wB', b7: 'wP', c8: 'bB' });
  eq(P(apply(s2, 'b7b8n').state, 'b8').t, 'N');
});

// ---------- Hříšníci ----------
t('Hříšník smí o 2 pole kdykoliv', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wP' });
  ok(has(s, 'd4d6'));
  const s2 = pos({ ...FAR, e1: 'wK', e8: 'bK', d4: 'wP', d5: 'bP' });
  ok(!has(s2, 'd4d6'));
});

t('Dvojkrok na poslední řadu = Spása (bez Hranice)', () => {
  const s = pos({ ...FAR, e1: 'wK', e5: 'bK', d6: 'wP' });
  ok(has(s, 'd6d8q')); ok(has(s, 'd6d8n')); ok(!has(s, 'd6d8r'));
  eq(apply(s, 'd6d8q').state.ep, -1);
});

t('Tajný hřích po dvojkroku kdekoliv, bez pokání; kající ho nesmí', () => {
  const s = pos({ ...FAR, e1: 'wK', e8: 'bK', d3: 'wP', e5: 'bP' });
  const r = apply(s, 'd3d5');
  ok(has(r.state, 'e5d4'));
  const r2 = apply(r.state, 'e5d4');
  ok(!P(r2.state, 'd4').pen);
  ok(!P(r2.state, 'd5'));
  const s2 = pos({ ...FAR, e1: 'wK', e8: 'bK', d3: 'wP', e5: 'bP*' });
  ok(!has(apply(s2, 'd3d5').state, 'e5d4'));
});

t('Spása ruší pokání', () => {
  const s = pos({ ...FAR, e1: 'wK', e5: 'bK', c7: 'wP', d8: 'bN' });
  const r = apply(s, 'c7d8q');
  ok(!P(r.state, 'd8').pen);
});

// ---------- Konkláve a konec ----------
t('Pád Papeže s jedním čistým Kardinálem: automatická volba', () => {
  const s = pos({ a1: 'wR', h1: 'wR', d7: 'wR', h8: 'bR', e8: 'bK', c8: 'bB', f5: 'bB*', h5: 'wQ', e1: 'wK' });
  const r = apply(s, 'h5e8');
  eq(P(r.state, 'c8').t, 'K');
  ok(r.events.some((e) => e.type === 'conclave'));
});

t('Konkláve se dvěma čistými Kardinály', () => {
  const s = pos({ a1: 'wR', h1: 'wR', d7: 'wR', h8: 'bR', e8: 'bK', c8: 'bB', f5: 'bB', h5: 'wQ', e1: 'wK' });
  const r = apply(s, 'h5e8');
  ok(r.state.conclave);
  eq(acts(r.state).sort(), ['@c8', '@f5']);
  const r2 = apply(r.state, '@f5');
  eq(P(r2.state, 'f5').t, 'K');
  eq(r2.state.turn, 'b');
});

t('Anathema: Papež padne a není čistý Kardinál', () => {
  const s = pos({ a1: 'wR', h1: 'wR', d7: 'wR', h8: 'bR', e8: 'bK', c8: 'bB*', h5: 'wQ', e1: 'wK' });
  const r = apply(s, 'h5e8');
  eq(r.state.result, { winner: 'w', reason: 'anathema' });
});

t('Interdikt: hráč bez legálního tahu prohrává', () => {
  const s = pos({ a1: 'wR', a2: 'wR', b1: 'wK', b2: 'wP*', a3: 'bP', b3: 'bP', c1: 'bN', c2: 'bN', e8: 'bK', g8: 'bR', h7: 'bR' }, 'b');
  const r = apply(s, 'e8e7');
  eq(r.state.result, { winner: 'b', reason: 'interdict' });
});

t('Poslední Kardinál zvolen Papežem → Křížová výprava', () => {
  const s = pos({ a1: 'wR', h1: 'wR', d7: 'wR', h8: 'bR', e8: 'bK', c8: 'bB', b8: 'bN', h5: 'wQ', e1: 'wK', c1: 'wB' });
  const r = apply(s, 'h5e8');
  eq(P(r.state, 'b8').t, 'C');
  ok(r.state.crusade.b);
});

out.innerHTML += `\n${pass} prošlo, ${fail} selhalo`;
document.title = fail ? 'FAIL ' + fail : 'OK ' + pass;
</script>
</body></html>
